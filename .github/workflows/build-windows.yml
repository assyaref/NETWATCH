name: Build NETWATCH.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller scapy pywebview

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name NETWATCH --icon assets\netwatch.ico
          --add-data "netwatch\static;netwatch\static"
          --collect-submodules scapy
          netwatch_app.py

      - name: Smoke test (imports and static files are bundled)
        shell: pwsh
        run: |
          python -c "import netwatch.server, netwatch.capture, netwatch.window, webview, scapy.all"
          if (-not (Test-Path dist\NETWATCH.exe)) { throw "NETWATCH.exe missing" }
          "{0:N1} MB" -f ((Get-Item dist\NETWATCH.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: NETWATCH-windows
          path: dist/NETWATCH.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/NETWATCH.exe --title "NETWATCH ${{ github.ref_name }}" --generate-notes
